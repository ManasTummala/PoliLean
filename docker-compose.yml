services:
  api:
    # Build the image from ./Dockerfile and tag it polilean:latest.
    build: .
    image: polilean:latest
    container_name: polilean-api
    # Port mapping: HOST:CONTAINER
    ports:
      - "8000:8000"
    environment:
      - HF_HUB_DISABLE_TELEMETRY=1
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
      - polilean-cache:/home/appuser/.cache/polilean
    restart: unless-stopped

volumes:
  hf-cache:
  polilean-cache:
