[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polilean"
version = "0.2.0"
description = "Political leaning analyzer for arbitrary text — spaCy preprocessing, scikit-learn classification, pandas data handling."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Manas Tummala" }]
requires-python = ">=3.10"
keywords = ["politics", "nlp", "text-analysis", "machine-learning", "spacy", "scikit-learn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "spacy>=3.7",
  "scikit-learn>=1.7.2,<2",
  "pandas>=2.0",
  "numpy>=1.26",
  "requests>=2.31",
  "datasets>=2.19,<3.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.scripts]
polilean = "polilean.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/polilean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
